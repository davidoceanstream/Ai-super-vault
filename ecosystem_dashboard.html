<style>
:root {

  --gold-light: #F4E5C2;
  --text-main: #FDFBF7;
  --text-muted: #94A3B8;
  --accent-green: #10B981;
  --accent-amber: #F59E0B;
  --accent-blue: #38BDF8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-primary);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
  line-height: 1.6;
  padding: 30px;
}
.header {
  text-align: center;
  padding: 40px 20px 30px;
  background: radial-gradient(circle at center, #1E293B 0%, #0A0F1D 100%);
  border: 1px solid var(--border-gold);
  border-radius: 16px;
  margin-bottom: 25px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.header h1 {
  font-family: 'Cinzel', serif;
  font-size: 2.2rem;
  color: var(--gold-primary);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.header p {
  color: var(--text-muted);
  font-size: 0.95rem;
}
.lang-toggle-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 20px;
  gap: 10px;
}
.lang-btn {
  padding: 6px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border-gold);
  color: var(--gold-light);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 600;
  transition: all 0.2s;
}
.lang-btn.active, .lang-btn:hover {
  background: var(--gold-primary);
  color: #0A0F1D;
}
.stats-banner {
  display: flex;
  gap: 20px;
  margin-bottom: 25px;
  flex-wrap: wrap;
}
.stat-card {
  flex: 1;
  min-width: 180px;
  background: var(--bg-surface);
  border: 1px solid var(--border-gold);
  border-radius: 12px;
  padding: 16px 20px;
  text-align: center;
}
.stat-card .num {
  font-family: 'Cinzel', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--gold-primary);
}
.stat-card .lbl {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 30px;
  align-items: center;
  justify-content: space-between;
}
.search-box {
  flex: 1;
  min-width: 280px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 12px 18px;
  background: var(--bg-surface);
  border: 1px solid var(--border-gold);
  border-radius: 10px;
  color: var(--text-main);
  font-size: 0.95rem;
  outline: none;
}
.search-box input:focus {
  border-color: var(--gold-primary);
  box-shadow: 0 0 10px var(--border-gold-glow);
}
.filter-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 10px 18px;
  background: var(--bg-surface);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-muted);
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  font-size: 0.88rem;
  transition: all 0.2s ease;
}
.tab-btn.active, .tab-btn:hover {
  background: var(--bg-card);
  color: var(--gold-light);
  border-color: var(--gold-primary);
}
.tab-btn.active {
  box-shadow: 0 0 12px rgba(212, 175, 122, 0.3);
}
.chapter-select {
  padding: 10px 14px;
  background: var(--bg-surface);
  border: 1px solid var(--border-gold);
  border-radius: 8px;
  color: var(--gold-light);
  font-size: 0.88rem;
  outline: none;
}
.chapter-select option {
  background: var(--bg-surface);
  color: var(--text-main);
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 20px;
}
.card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.2s, border-color 0.2s;
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--border-gold);
  background: var(--bg-card-hover);
}
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.card-title {

  font-weight: 700;
  color: var(--text-main);
}
.badge {

  font-weight: 600;

  border-radius: 20px;
  letter-spacing: 0.5px;
  text-transform: uppercase;

.badge-inst {

.badge-vault {

.badge-order {

.card-desc {

  margin-bottom: 12px;

}
.example-box {

  color: #94A3B8;
  margin-bottom: 16px;

.card-footer {

  justify-content: space-between;
  align-items: center;
  padding-top: 14px;
  border-top: 1px solid rgba(255,255,255,0.06);

.repo-btn {

  align-items: center;

  font-weight: 600;

  color: #0A0F1D;

const i18n = {
  en: {
    headerDesc: 'Universal AI Tool Ecosystem & Master Repository Dashboard (143 Tools)',
    searchPlaceholder: '🔍 Search repositories, tools, or domain keywords...',
    tabAll: 'All (143)',
    tabInst: '🟢 Installed (48)',
    tabVault: '🟡 Vault (95)',
    tabOrder: '📦 Core Bundle (2)',
    lblTotal: 'TOTAL REPOSITORIES',
    lblInst: 'INSTALLED',
    lblVault: 'VAULT REPOS',
    lblOrder: 'CORE BUNDLE',
    analogyTitle: '💡 Real-World Analogy:',
    exampleTitle: '🎯 Practical Use:',
    badgeInst: '🟢 Installed',
    badgeVault: '🟡 In Vault'
  },
  th: {
    headerDesc: 'สารานุกรมคลังเครื่องมือ AI สากลและแดชบอร์ดระบบ (143 คลังเครื่องมือ)',
    searchPlaceholder: '🔍 ค้นหาเครื่องมือ, หมวดหมู่, หรือคำอธิบาย...',
    tabAll: 'ทั้งหมด (143)',
    tabInst: '🟢 ติดตั้งแล้ว (48)',
    tabVault: '🟡 คลัง Vault (95)',
    tabOrder: '📦 ชุดแกนหลัก (2)',
    lblTotal: 'เครื่องมือทั้งหมด',
    lblInst: 'ติดตั้งแล้ว',
    lblVault: 'คลังพร้อมโคลน (VAULT)',
    lblOrder: 'ชุดแกนหลัก',
    analogyTitle: '💡 เปรียบเทียบชีวิตจริง:',
    exampleTitle: '🎯 ตัวอย่างการใช้จริง:',
    badgeInst: '🟢 ติดตั้งแล้ว',
    badgeVault: '🟡 คลัง Vault'
  }
};

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');
  document.getElementById('btn-th').classList.toggle('active', lang === 'th');

  const t = i18n[lang];
  document.getElementById('header-desc').innerText = t.headerDesc;
  document.getElementById('searchInput').placeholder = t.searchPlaceholder;
  document.getElementById('tab-all').innerText = t.tabAll;
  document.getElementById('tab-inst').innerText = t.tabInst;
  document.getElementById('tab-vault').innerText = t.tabVault;
  document.getElementById('tab-order').innerText = t.tabOrder;
  document.getElementById('lbl-total').innerText = t.lblTotal;
  document.getElementById('lbl-inst').innerText = t.lblInst;
  document.getElementById('lbl-vault').innerText = t.lblVault;
  document.getElementById('lbl-order').innerText = t.lblOrder;

  render();
}

function render() {
  const grid = document.getElementById('toolsGrid');
  grid.innerHTML = '';
  const langText = i18n[currentLang];

  const filtered = tools.filter(t => {
    if (currentFilter === 'installed' && !t.installed_pc1) return false;
    if (currentFilter === 'vault' && t.installed_pc1) return false;
    if (currentFilter === 'orderman' && !t.in_dist_bundle) return false;

    if (currentChapter !== 'all' && t.chapter_id !== currentChapter) return false;

    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      const match = (t.name && t.name.toLowerCase().includes(q)) ||
                    (t.brief && t.brief.toLowerCase().includes(q)) ||
                    (t.analogy && t.analogy.toLowerCase().includes(q)) ||
                    (t.repo && t.repo.toLowerCase().includes(q));
      if (!match) return false;
    }
    return true;
  });

  filtered.forEach(t => {
    const card = document.createElement('div');
    card.className = 'card';

    let badgeClass = t.installed_pc1 ? 'badge-inst' : 'badge-vault';
    let badgeText = t.installed_pc1 ? langText.badgeInst : langText.badgeVault;
    if (t.in_dist_bundle) {
      badgeText += ' | 📦 Core';
    }

    card.innerHTML = `
      <div>
        <div class="card-header">
          <div class="card-title">${t.name}</div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="path-box">📍 ${t.install_path_pc1 || 'External Git Repository'}</div>
        <div class="card-desc">${t.brief}</div>
        <div class="analogy-box">${langText.analogyTitle} ${t.analogy}</div>
        <div class="example-box">${langText.exampleTitle} ${t.example}</div>
      </div>
      <div class="card-footer">
        <span style="font-size:0.75rem; color:var(--text-muted);">${t.install_type || 'Repository'}</span>
        <a href="${t.url}" target="_blank" class="repo-btn">
          GitHub Repo ↗
        </a>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchQuery = e.target.value;
  render();
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render();
  });
});

document.getElementById('chapterSelect').addEventListener('change', (e) => {
  currentChapter = e.target.value;
  render();
});

render();
</script>
